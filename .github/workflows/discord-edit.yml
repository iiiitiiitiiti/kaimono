name: Discord のお知らせを書き直す

# 前に送った更新のお知らせを、あとから書き直す（docs/decisions/007）。
# GitHub の Actions の画面か `gh workflow run discord-edit.yml -f notes=... -f message=...` で動かす。
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 新しいお知らせの文（1行に1つ。見出しと最後の一言は自動で付く）
        required: true
      message:
        description: 書き直す投稿のリンク（空なら最後に送った投稿）
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Edit the Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          APP_NAME: かいもの
          ID_ARTIFACT: discord-message
          EDIT_NOTES: ${{ inputs.notes }}
          EDIT_MESSAGE: ${{ inputs.message }}
        run: bash .github/notify-discord.sh
